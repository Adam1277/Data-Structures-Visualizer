<!DOCTYPE html>
<html lang="en">
<head>
    <script src="./js/main.js" defer></script>
    <meta charset="UTF-8">
    <title>Sorting</title>
    <style>
        body {
            background: linear-gradient(-45deg, purple, deeppink, darkblue, lightskyblue);
            background-size: 400% 400%;
            height: 100vh;
        }
        @keyframes gradient {
            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }
        }
        #Heading{
            align-items: center;
            text-align: center;
            border: 2px solid black;
            width: 100%;
            height: 270px;
            border-radius: 15px;
        }
        #back-button{
            height: 10%;
            width: 9%;
        }
        .mainButton{
            margin-top: 10px;
            margin-left: 2px;
            margin-right: 2px;
            background: blue;
            font-family: monospace;
            color: white;
            border-radius: 8px;
            border-color: blue;
            height: 10%;
        }
        .mainButton:hover{
            box-shadow: 0 4px 8px rgba(0.4,0.4,0.4,0.4);
        }

        h1{
            font-family: monospace;
            font-size: 30px;
        }
        #main-container{
            display: flex;
            height: 60%;
            /* border: 2px solid black; */
            justify-content: center;
            align-items: center;
        }
        #container{
            border: 2px solid black;
            width: 60%;
            height: 75%;
            display: flex;
            align-items: flex-end;
        }
        footer{
            text-align: center;
        }
        #start-button{
            margin: 10px;
            font-family: monospace;
            color: white;
            border-radius: 8px;
            border-color: white;
            height: 15%;
            background: blue;
        }
        #start-button:hover{
            box-shadow: 0 4px 8px rgba(0.4, 0.4, 0.4, 0.4);
            background: green;
        }
        #value-number{
            height: 10%;
            border-radius: 6px;
        }
    </style>
</head>
<body>
    <div id="Heading">
        <h1>Sorting Algorithms</h1>
        <button id="back-button" class = "mainButton" type="button" onclick="returnToIndex()">Homepage</button>
        <button id="searchButton" class = "mainButton" type="button" onclick="searchingPage()">Searching</button><br>
        <button id="load-container-button" class = "mainButton" type="button" onclick="loadContainerSort()">Load Container</button><br>
        <button id="bubbleSort-button" class = "mainButton" type="button">Bubble Sort</button>
        <button id="selectionSort-button" class = "mainButton" type="button">Selection Sort</button>
        <button id="insertionSort-button" class = "mainButton" type="button">Insertion Sort</button>
        <button id="quickSort-button" class = "mainButton" type="button">Quick Sort</button><br>
        <button id="start-button">Start Sorting</button>
        <input id="value-number" type="text" placeholder="Number of Data Elements">
    </div>

    <div id="main-container">
        <div id="container"></div>
    </div>
    <footer>
        <strong><p>© 2024 Adam Levere. All rights reserved.</p></strong>
    </footer>
</body>
</html>
