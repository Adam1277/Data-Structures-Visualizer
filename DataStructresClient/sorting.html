<!DOCTYPE html>
<html lang="en">
<head>
    <script src="./js/main.js" defer></script>
    <meta charset="UTF-8">
    <title>Sorting</title>
    <style>
        html{
            font-family: 'Roboto', sans-serif;
        }
        body {
            background: linear-gradient(-45deg, purple, deeppink, darkblue, lightskyblue);
            background-size: 400% 400%;
            height: 100vh;
        }
        @keyframes gradient {
            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }
        }
        #Heading{
            align-items: center;
            text-align: center;
            /* border: 2px solid black; */
            width: 100%;
            height: 270px;
            border-radius: 15px;
        }
        #back-button{
            width: 9%;
        }
        .mainButton{
            margin-top: 10px;
            margin-left: 2px;
            margin-right: 2px;
            background: blue;
            font-family: monospace;
            color: white;
            border-radius: 8px;
            border-color: blue;
            height: 13%;
        }
        .mainButton:hover{
            box-shadow: 0 4px 8px rgba(0.4,0.4,0.4,0.4);
        }
        h1{
            font-family: monospace;
            font-size: 30px;
        }
        #main-container{
            display: flex;
            height: 60%;
            justify-content: center;
        }
        #container{
            /* border: 2px solid black; */
            border-left: 2px solid black;
            border-right: 2px solid black;
            width: 60%;
            height: 75%;
            display: flex;
            align-items: flex-end;
            padding-top: 20px;
        }
        footer{
            text-align: center;
        }
        .functional{
            margin: 10px;
            font-family: monospace;
            color: white;
            border-radius: 8px;
            height: 15%;
            background-color: black; /* Green */
            border: none; /* No border */
            padding: 10px 20px; /* Padding for sizing */
            font-size: 16px; /* Text size */
            cursor: pointer; /* Cursor change on hover */
            transition: all 0.3s ease; /* Smooth transitions */
        }
        .functional:hover{
            box-shadow: 0 4px 8px rgba(0.4, 0.4, 0.4, 0.4);
            border-color: red;
            background: lightgreen;
            color: black;
        }
        #value-number{
            height: 10%;
            border-radius: 6px;
        }
        .Des-item{
            display: inline-block;
            padding: 10px;
            text-align: center;
            font-family: 'Roboto', sans-serif;
        }
        .info-display{
            font-family: cursive;
            position: absolute;
            padding-left: 30px;
        }
        #space{
            padding-top: 200px;
        }
        #time-text{
            border: 2px solid black;
            width: 70px;
            height: 70px;
            position: absolute;
            left: 60px;
            top: 320px;
        }
        #space-text{
            border: 2px solid black;
            width: 70px;
            height: 70px;
            position: absolute;
            left: 60px;
            top: 520px;
        }
    </style>
</head>
<body>
    <div id="Heading">
        <h1>Sorting Algorithms</h1>
        <nav id="Description-Container">
            <div class="Des-item">Created by: Adam Levere</div>
            <div class="Des-item">GitHub: <a href="https://github.com/Adam1277?ocid=AIDcmmli8vlwie_SEM__k_Cj0KCQjw_qexBhCoARIsAFgBlev60OyYeTOD02C7Ec2-gK6dY8uKPm9W5VT_ekwLOFvEg4Z4jfbrEnQaAtWyEALw_wcB_k_">Adam1277</a></div>
            <div class="Des-item">LinkedIn: <a href="https://www.linkedin.com/in/adam-levere-b97770273/">Adam Levere</a> </div>
        </nav>
        <button id="back-button" class = "mainButton" type="button" onclick="returnToIndex()">Homepage</button>
        <button id="searchButton" class = "mainButton" type="button" onclick="searchingPage()">Searching</button><br>
        <button id="load-container-button" class = "mainButton" type="button" onclick="loadContainerSort()">Load Container</button>
        <input id="value-number" type="text" placeholder="Number of Data Elements"><br>
        <button id="bubbleSort-button" class = "mainButton" type="button">Bubble Sort</button>
        <button id="selectionSort-button" class = "mainButton" type="button">Selection Sort</button>
        <button id="insertionSort-button" class = "mainButton" type="button">Insertion Sort</button>
        <button id="quickSort-button" class = "mainButton" type="button">Quick Sort</button><br>
        <button id="slow-algo" class="functional">Slower</button>
        <button id="start-button" class="functional">Start Sorting</button>
        <button id="fast-algo" class="functional">Faster</button>
    </div>

    <strong id="time" class = "info-display">Time Complexity:</strong>
    <div id="time-text"></div>

    <strong id="space" class = "info-display">Space Complexity:</strong>
    <div id="space-text"></div>

    <div id="main-container">
        <div id="container"></div>
    </div>
    <footer>
        <strong><p>© 2024 Adam Levere. All rights reserved.</p></strong>
    </footer>
</body>
</html>
